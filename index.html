<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTL - መግቢያ (Login)</title>
    <style>
        body {
            background-color: #0d1117;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .box {
            background-color: #161b22;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #30363d;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            color: #58a6ff;
            margin-bottom: 15px;
            font-size: 20px;
        }
        .telegram-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #0088cc, #1f6feb);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            box-sizing: border-box;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(0, 136, 204, 0.3);
        }
        .notice {
            background-color: #1f242d;
            border-left: 4px solid #0088cc;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-size: 12px;
            color: #c9d1d9;
            text-align: left;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #8b949e;
        }
        input {
            width: 100%;
            padding: 12px;
            background: #0b0f19;
            border: 1px solid #30363d;
            color: white;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h2>TTL Quantitative</h2>
        
        <div class="notice">
            ⚠️ ከመመዝገብዎ በፊት እባክዎ የቴሌግራም ቻናላችንን ይቀላቀሉ!
        </div>

        <a href="https://t.me/ALDUC23" target="_blank" class="telegram-btn">📢 ቴሌግራም ቻናል ይቀላቀሉ</a>

        <div class="input-group">
            <label>ስልክ ቁጥር (Phone Number)</label>
            <input type="text" id="phone" placeholder="ምሳሌ: 0911223344">
        </div>
        
        <div class="input-group">
            <label>የይለፍ ቃል (Password)</label>
            <input type="password" id="password" placeholder="********">
        </div>
        
        <button type="button" onclick="handleLogin()">ግባ / ተመዝገብ (Login)</button>
    </div>

    <script>
        function handleLogin() {
            const phoneInput = document.getElementById('phone').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!phoneInput || !passwordInput) {
                alert("እባክዎ ስልክ ቁጥር እና የይለፍ ቃል ያስገቡ!");
                return;
            }
            
            // መረጃውን በመያዝ ወደ index.html እንልካለን
            localStorage.setItem('userPhone', phoneInput);
            localStorage.setItem('isLoggedIn', 'true');
            
            // ወደ ቪአይፒ ሆም ገጽ መቀየር
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
